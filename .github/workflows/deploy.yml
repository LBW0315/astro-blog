name: Deploy to S3

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-1
  S3_BUCKET: astro-blog-315
  DISTRIBUTION_ID: E24KB90STS6FEW
  ROLE_ARN: arn:aws:iam::642370443495:role/gha-astro-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Upload hashed assets
        run: |
          aws s3 sync ./dist/ s3://${{ env.S3_BUCKET }}/ \
            --cache-control "public,max-age=31536000,immutable" \
            --exclude "*" --include "_astro/*"

      - name: Upload HTML and others
        run: |
          aws s3 sync ./dist/ s3://${{ env.S3_BUCKET }}/ --delete \
            --cache-control "public,max-age=0,must-revalidate" \
            --exclude "_astro/*"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id ${{ env.DISTRIBUTION_ID }} \
            --paths "/*"
