    <path d="M276 240v12a44 12 0 0 0 88 0v-12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/><ellipse cx="320" cy="240" rx="44" ry="12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/>
    <path d="M276 218v12a44 12 0 0 0 88 0v-12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/><ellipse cx="320" cy="218" rx="44" ry="12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/>
