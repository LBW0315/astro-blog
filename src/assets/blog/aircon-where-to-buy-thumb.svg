    <path d="M132 196v12a44 12 0 0 0 88 0v-12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/><ellipse cx="176" cy="196" rx="44" ry="12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/>
    <path d="M132 174v12a44 12 0 0 0 88 0v-12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/><ellipse cx="176" cy="174" rx="44" ry="12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/>
    <path d="M276 284v12a44 12 0 0 0 88 0v-12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/><ellipse cx="320" cy="284" rx="44" ry="12" fill="#fffdfb" stroke="#5e564f" stroke-width="3.5"/>
