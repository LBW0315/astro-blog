<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「ブログを始めて1か月。」のカード用の絵（自作）
    アクセスのグラフが映ったノートパソコンと、芽が出たばかりの鉢。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 机 -->
    <path d="M56 270H584" stroke="#c9bfb4" stroke-width="4"/>
    <!-- ノートパソコン -->
    <rect x="146" y="64" width="268" height="180" rx="14" fill="#fffdfb"/>
    <rect x="112" y="244" width="336" height="24" rx="12" fill="#fffdfb"/>
    <path d="M250 256h60" stroke-width="3"/>
    <!-- 画面の中のグラフ（最初に山があって、あとは低いまま） -->
    <path d="M176 92v124h210" stroke="#93877a" stroke-width="3"/>
    <path d="M186 204l26-6 26-66 28 26 26 30 28 8 28-6 24 8" stroke="#2a6058" stroke-width="5"/>
    <circle cx="372" cy="198" r="6" fill="#2a6058" stroke="#2a6058" stroke-width="3"/>
    <!-- 芽が出たばかりの鉢 -->
    <path d="M490 222h76l-9 46h-58z" fill="#f6eaea"/>
    <path d="M528 222C528 200 526 186 528 166" stroke="#2a6058"/>
    <path d="M528 184C506 182 496 166 498 150C516 152 528 164 528 184Z" fill="#e6f0ee" stroke="#2a6058" stroke-width="4"/>
    <path d="M528 168C550 166 560 150 558 134C540 136 528 148 528 168Z" fill="#e6f0ee" stroke="#2a6058" stroke-width="4"/>
  </g>
</svg>
