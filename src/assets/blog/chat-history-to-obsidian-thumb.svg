<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「ObsidianにChatGPTとClaudeのチャットのやり取りをぶちこんでみた」のカード用の絵（自作）
    チャットの吹き出しが、つながったノートに変わる。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="31"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- AIとのチャット -->
    <path d="M82 66h140a22 22 0 0 1 22 22v40a22 22 0 0 1 -22 22h-98l-34 26 8 -26h-16a22 22 0 0 1 -22 -22v-40a22 22 0 0 1 22 -22z" fill="#fffdfb"/>
    <path d="M88 96h126M88 120h84" stroke="#93877a" stroke-width="3.5"/>
    <path d="M132 196h140a22 22 0 0 1 22 22v40a22 22 0 0 1 -22 22h-16l8 26 -34 -26h-98a22 22 0 0 1 -22 -22v-40a22 22 0 0 1 22 -22z" fill="#e6f0ee"/>
    <path d="M138 226h126M138 250h84" stroke="#2a6058" stroke-width="3.5"/>
    <path d="M316 180H362M362 180l-11 -10M362 180l-11 10" stroke="#7e4548"/>
    <!-- つながったノートになる -->
    <path d="M490 180L412 96M490 180L574 92M490 180L404 268M490 180L580 262M412 96L404 268M574 92L580 262" stroke="#93877a" stroke-width="3.5"/>
    <circle cx="412" cy="96" r="16" fill="#fffdfb"/><circle cx="574" cy="92" r="13" fill="#f6eaea" stroke="#7e4548"/>
    <circle cx="404" cy="268" r="13" fill="#e6f0ee" stroke="#2a6058"/><circle cx="580" cy="262" r="16" fill="#fffdfb"/>
    <circle cx="490" cy="180" r="30" fill="#2a6058" stroke="#2a6058"/>
  </g>
</svg>
