<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「えぇーー！？繋がってるーーー！！！」のカード用の絵（自作）
    鍵と、アドレスバーに鍵のついたブラウザ。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="22"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 鍵 -->
    <path d="M142 168v-38a46 46 0 0 1 92 0v38" stroke-width="10"/>
    <rect x="108" y="166" width="160" height="126" rx="18" fill="#2a6058" stroke="#2a6058"/>
    <circle cx="188" cy="216" r="13" fill="#fffdfb" stroke="none"/><path d="M188 222v28" stroke="#fffdfb" stroke-width="9"/>
    <path d="M286 220H322M322 220l-11 -10M322 220l-11 10" stroke="#2a6058"/>
    <!-- 鍵のかかったブラウザ -->
    <rect x="342" y="70" width="246" height="222" rx="14" fill="#fffdfb"/>
    <path d="M342 118H588" stroke-width="3"/>
    <rect x="362" y="82" width="206" height="24" rx="12" fill="#e6f0ee" stroke="none"/>
    <rect x="374" y="91" width="12" height="10" rx="2" fill="#2a6058" stroke="none"/><path d="M376.5 91v-3a3.5 3.5 0 0 1 7 0v3" stroke="#2a6058" stroke-width="2.4"/>
    <path d="M396 95h110" stroke="#2a6058" stroke-width="3.5"/>
    <rect x="366" y="140" width="120" height="20" rx="8" fill="#93877a" stroke="none"/>
    <path d="M366 188h198M366 214h198M366 240h120" stroke="#93877a" stroke-width="3.5"/>
  </g>
</svg>
