<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「Keychron製トラックボール「Keychron T1 HE」が熱い！」のカード用の絵（自作）
    親指で玉を転がすトラックボールを上から見たところ。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="33"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 本体（上から見たところ） -->
    <path d="M196 204C196 116 268 68 348 78C428 88 474 150 462 226C452 290 388 322 316 310C246 300 196 268 196 204Z" fill="#fffdfb"/>
    <path d="M330 80C344 132 346 184 338 236M404 100C414 150 412 200 404 244" stroke-width="3.5"/>
    <path d="M286 262C330 250 396 248 456 240" stroke-width="3.5"/>
    <rect x="362" y="118" width="18" height="48" rx="9" fill="#e6f0ee" stroke="#2a6058" stroke-width="3.5"/>
    <!-- 親指で転がす玉 -->
    <circle cx="252" cy="196" r="50" fill="#2a6058" stroke="#2a6058"/>
    <path d="M224 178a34 34 0 0 1 26 -20" stroke="#fffdfb" stroke-width="5"/>
    <path d="M150 150q-22 46 0 92M150 150l-12 14M150 150l14 10M150 242l-12 -14M150 242l14 -10" stroke="#7e4548"/>
  </g>
</svg>
