<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「Obsidianを入れてみた」のカード用の絵（自作）
    線でつながったノート。真ん中のノートにつながりが集まっている。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="15"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ノート同士をつなぐ線 -->
    <path d="M320 180L128 92M320 180L512 84M320 180L112 262M320 180L520 270M320 180L320 60M128 92L112 262M512 84L520 270" stroke="#93877a" stroke-width="3.5"/>
    <!-- まわりのノート -->
    <g transform="translate(128 92) rotate(-6)"><rect x="-46" y="-34" width="92" height="68" rx="9" fill="#fffdfb"/><path d="M-28 -12h56M-28 4h56M-28 20h32" stroke="#93877a" stroke-width="3"/></g>
    <g transform="translate(512 84) rotate(5)"><rect x="-46" y="-34" width="92" height="68" rx="9" fill="#e6f0ee"/><path d="M-28 -12h56M-28 4h56M-28 20h32" stroke="#93877a" stroke-width="3"/></g>
    <g transform="translate(112 262) rotate(4)"><rect x="-46" y="-34" width="92" height="68" rx="9" fill="#e6f0ee"/><path d="M-28 -12h56M-28 4h56M-28 20h32" stroke="#93877a" stroke-width="3"/></g>
    <g transform="translate(520 270) rotate(-5)"><rect x="-46" y="-34" width="92" height="68" rx="9" fill="#fffdfb"/><path d="M-28 -12h56M-28 4h56M-28 20h32" stroke="#93877a" stroke-width="3"/></g>
    <!-- 小さなノート（点） -->
    <circle cx="320" cy="60" r="12" fill="#f6eaea" stroke="#7e4548" stroke-width="4"/>
    <!-- 真ん中の、つながりが集まるノート -->
    <circle cx="320" cy="180" r="40" fill="#2a6058" stroke="#2a6058"/>
    <path d="M302 168h36M302 182h36M302 196h20" stroke="#fffdfb" stroke-width="4"/>
  </g>
</svg>
