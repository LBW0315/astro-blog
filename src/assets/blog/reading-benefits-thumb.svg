<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「読書に秘められた力とメリット ― 20個以上を、根拠の強さで分けてみた」のカード用の絵（自作）
    左の開いた本から、矢印で右の3段のトレーへ。読書の効果を、根拠の強さで3つに仕分けるところ。
    上の段（青磁）がしっかりしたもの、中の段が条件つき、下の段（灰桜の点線）がまだ確かめられていないもの。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="6"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 300H600" stroke="#c9bfb4" stroke-width="4"/>
    <!-- 開いた本 -->
    <path d="M60 150V282C92 272 128 276 152 290C176 276 212 272 244 282V150" fill="#2a6058" stroke="#2a6058"/>
    <path d="M152 152C128 134 92 132 70 142V272C92 264 128 266 152 282Z" fill="#fffdfb"/>
    <path d="M152 152C176 134 212 132 234 142V272C212 264 176 266 152 282Z" fill="#fffdfb"/>
    <path d="M152 152V282" stroke-width="3.5"/>
    <path d="M86 170C104 165 122 165 138 172M86 194C104 189 122 189 138 196M86 218C104 213 122 213 138 220M166 172C182 165 200 165 218 170M166 196C182 189 200 189 218 194M166 220C182 213 200 213 218 218" stroke="#93877a" stroke-width="3"/>
    <!-- 矢印 -->
    <path d="M276 210H346M346 210l-14 -12M346 210l-14 12" stroke="#7e4548"/>
    <!-- 3段のトレー -->
    <rect x="384" y="92" width="200" height="56" rx="10" fill="#e6f0ee" stroke="#2a6058"/>
    <rect x="408" y="106" width="64" height="28" rx="5" fill="#2a6058" stroke="#2a6058" stroke-width="3"/>
    <rect x="488" y="106" width="64" height="28" rx="5" fill="#2a6058" stroke="#2a6058" stroke-width="3"/>
    <rect x="384" y="166" width="200" height="56" rx="10" fill="#fffdfb"/>
    <rect x="408" y="180" width="64" height="28" rx="5" fill="#f2eee9" stroke-width="3"/>
    <rect x="488" y="180" width="64" height="28" rx="5" fill="#f2eee9" stroke-width="3"/>
    <rect x="384" y="240" width="200" height="56" rx="10" fill="#f6eaea" stroke="#7e4548" stroke-dasharray="12 9"/>
    <rect x="408" y="254" width="64" height="28" rx="5" fill="#fffdfb" stroke="#7e4548" stroke-width="3" stroke-dasharray="7 6"/>
    <rect x="488" y="254" width="64" height="28" rx="5" fill="#fffdfb" stroke="#7e4548" stroke-width="3" stroke-dasharray="7 6"/>
  </g>
</svg>
