<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「読む人と読まない人の差は、開いていく」のカード用の絵（自作）
    左に1冊だけの低い本の山、右に5冊積んだ高い本の山。間の灰桜の両矢印で、2つの山の高さの差を示している。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="9"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 300H600" stroke="#c9bfb4" stroke-width="4"/>
    <!-- 低い本の山（1冊） -->
    <rect x="96" y="258" width="176" height="40" rx="5" fill="#fffdfb"/>
    <path d="M248 266V290" stroke="#93877a" stroke-width="3"/>
    <!-- 高い本の山（5冊） -->
    <rect x="384" y="258" width="184" height="40" rx="5" fill="#2a6058" stroke="#2a6058"/>
    <path d="M544 266V290" stroke="#fffdfb" stroke-width="3"/>
    <rect x="392" y="216" width="168" height="40" rx="5" fill="#e6f0ee" stroke="#2a6058"/>
    <path d="M536 224V248" stroke="#2a6058" stroke-width="3"/>
    <rect x="380" y="174" width="180" height="40" rx="5" fill="#fffdfb"/>
    <path d="M536 182V206" stroke="#93877a" stroke-width="3"/>
    <rect x="396" y="132" width="164" height="40" rx="5" fill="#2a6058" stroke="#2a6058"/>
    <path d="M536 140V164" stroke="#fffdfb" stroke-width="3"/>
    <rect x="386" y="90" width="176" height="40" rx="5" fill="#e6f0ee" stroke="#2a6058"/>
    <path d="M538 98V122" stroke="#2a6058" stroke-width="3"/>
    <!-- 高さの差の両矢印 -->
    <path d="M328 96V250M328 96l-12 14M328 96l12 14M328 250l-12 -14M328 250l12 -14" stroke="#7e4548"/>
    <path d="M276 256H312M344 90H372" stroke="#93877a" stroke-width="3" stroke-dasharray="6 7"/>
  </g>
</svg>
