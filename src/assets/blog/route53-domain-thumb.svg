<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「bunbou.com は埋まっていた」のカード用の絵（自作）
    ドメインを検索して、1つ目は埋まっていて、2つ目が空いていた。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="19"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- ドメインを探す検索窓 -->
    <rect x="86" y="50" width="468" height="76" rx="38" fill="#fffdfb"/>
    <circle cx="134" cy="84" r="15"/><path d="M145 96l13 13"/>
    <rect x="180" y="74" width="150" height="24" rx="12" fill="#e6f0ee" stroke="none"/>
    <path d="M346 96h.1" stroke-width="8"/>
    <rect x="362" y="74" width="64" height="24" rx="12" fill="#f6eaea" stroke="none"/>
    <!-- 1つ目は埋まっていた -->
    <rect x="116" y="158" width="408" height="64" rx="14" fill="#fffdfb"/>
    <rect x="140" y="180" width="170" height="20" rx="10" fill="#e3dcd4" stroke="none"/>
    <path d="M468 176l28 28M496 176l-28 28" stroke="#7e4548" stroke-width="5"/>
    <!-- 2つ目が空いていた -->
    <rect x="116" y="246" width="408" height="64" rx="14" fill="#e6f0ee" stroke="#2a6058"/>
    <rect x="140" y="268" width="190" height="20" rx="10" fill="#2a6058" stroke="none"/>
    <circle cx="482" cy="278" r="20" fill="#2a6058" stroke="#2a6058" stroke-width="3"/><path d="M473.0 278.4l6.4 6.8 11.6-13.2" stroke="#fffdfb" stroke-width="4"/>
  </g>
</svg>
