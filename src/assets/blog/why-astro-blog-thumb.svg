<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="1280" height="720">
  <!--
    記事「noteでもWordPressでもなく、Astro + S3 + CloudFrontでブログを書く理由」のカード用の絵（自作）
    3つの選択肢のうち1つを選び、その先にクラウドがある。
    方眼ノートの上に、サイトのライトテーマと同じ色で、図解と同じ手描き風の線で描いています。
  -->
  <defs>
    <filter id="s" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="13"/>
      <feDisplacementMap in="SourceGraphic" scale="4"/>
    </filter>
  </defs>
  <rect width="640" height="360" fill="#f2eee9"/>
  <path d="M32 0V360M64 0V360M96 0V360M128 0V360M160 0V360M192 0V360M224 0V360M256 0V360M288 0V360M320 0V360M352 0V360M384 0V360M416 0V360M448 0V360M480 0V360M512 0V360M544 0V360M576 0V360M608 0V360M0 20H640M0 52H640M0 84H640M0 116H640M0 148H640M0 180H640M0 212H640M0 244H640M0 276H640M0 308H640M0 340H640" fill="none" stroke="#e3dcd4" stroke-width="1" opacity="0.7"/>
  <g filter="url(#s)" fill="none" stroke="#5e564f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- 3つの選択肢 -->
    <rect x="70" y="64" width="140" height="176" rx="14" fill="#fffdfb" stroke="#5e564f"/><rect x="92" y="88" width="72" height="18" rx="8" fill="#93877a" stroke="none"/><path d="M92 134h96M92 160h96M92 186h60" stroke="#93877a" stroke-width="3.5"/>
    <rect x="250" y="64" width="140" height="176" rx="14" fill="#fffdfb" stroke="#5e564f"/><rect x="272" y="88" width="72" height="18" rx="8" fill="#93877a" stroke="none"/><path d="M272 134h96M272 160h96M272 186h60" stroke="#93877a" stroke-width="3.5"/>
    <rect x="430" y="64" width="140" height="176" rx="14" fill="#e6f0ee" stroke="#2a6058"/><rect x="452" y="88" width="72" height="18" rx="8" fill="#2a6058" stroke="none"/><path d="M452 134h96M452 160h96M452 186h60" stroke="#2a6058" stroke-width="3.5"/>
    <circle cx="560" cy="68" r="22" fill="#2a6058" stroke="#2a6058" stroke-width="3"/><path d="M550.1 68.4l7.0 7.5 12.8-14.5" stroke="#fffdfb" stroke-width="4"/>
    <!-- 選んだ先は、自分で組み立てるクラウド -->
    <path d="M500 250v26M500 276l-11 -11M500 276l11 -11" stroke="#2a6058"/>
    <path transform="translate(500 316) scale(0.62)" d="M-52 28C-84 28 -88 -16 -56 -22C-50 -60 6 -66 22 -34C58 -42 78 4 50 28Z" fill="#e6f0ee"/>
  </g>
</svg>
