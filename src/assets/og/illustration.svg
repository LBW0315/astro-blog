<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!--
    OGP 画像に使う1枚絵（自作）
    ブログ名「文房」にちなんだ机の情景。主役のペキニーズの手前に、積み重ねた本・万年筆・コーヒー。
    サイトのライトテーマと同じ色で、記事中の図解と線の太さをそろえています。
  -->
  <g fill="none" stroke="#5e564f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">

    <!-- 机の面 -->
    <path d="M12 352h376" stroke="#c9bfb4"/>

    <!-- ペキニーズ（奥で座っている。主役） -->
    <g transform="translate(86,45) scale(1.9)" stroke-width="1.45">
      <path fill="#fffdfb" d="M22 58Q15.6 46 24 38Q24 25 36 23Q40.8 11.2 52 15Q60 6.4 68 15Q79.2 11.2 84 23Q96 25 96 38Q104.4 46 98 58Q104.4 70 96 78Q96 90.4 84 92Q79.2 103 68 99Q60 107.2 52 99Q40.8 103 36 92Q24 90.4 24 78Q15.6 70 22 58Z"/>
      <path fill="#f3eee8" d="M40 32Q24 34 22 52Q20 67 29 75Q37 73 39 62Q43 47 40 32Z"/>
      <path fill="#f3eee8" d="M80 32Q96 34 98 52Q100 67 91 75Q83 73 81 62Q77 47 80 32Z"/>
      <path d="M44 101q6-7 12 0M64 101q6-7 12 0"/>
      <path d="M60 65v3M60 68q-3 3.5-6.5 1.2M60 68q3 3.5 6.5 1.2"/>
      <ellipse cx="44" cy="63" rx="4.5" ry="2.6" fill="#e3b9b9" stroke="none" opacity="0.6"/>
      <ellipse cx="76" cy="63" rx="4.5" ry="2.6" fill="#e3b9b9" stroke="none" opacity="0.6"/>
      <circle cx="48" cy="52" r="4.2" fill="#2e2a27" stroke="none"/>
      <circle cx="72" cy="52" r="4.2" fill="#2e2a27" stroke="none"/>
      <circle cx="49.6" cy="50.4" r="1.3" fill="#fffdfb" stroke="none"/>
      <circle cx="73.6" cy="50.4" r="1.3" fill="#fffdfb" stroke="none"/>
      <path fill="#2e2a27" stroke="none" d="M55.5 60.5Q60 57.5 64.5 60.5Q63 65 60 65Q57 65 55.5 60.5Z"/>
    </g>

    <!-- 積み重ねた本（手前・左） -->
    <g>
      <rect x="18" y="318" width="170" height="30" rx="6" fill="#e6f0ee"/>
      <path d="M34 318v30" stroke-width="2"/>
      <path d="M158 326h16M158 334h16" stroke-width="1.8" stroke="#93877a"/>

      <rect x="28" y="290" width="152" height="28" rx="6" fill="#f6eaea"/>
      <path d="M44 290v28" stroke-width="2"/>
      <path d="M152 298h16M152 306h16" stroke-width="1.8" stroke="#93877a"/>

      <rect x="36" y="262" width="138" height="28" rx="6" fill="#fffdfb"/>
      <path d="M52 262v28" stroke-width="2"/>
      <path d="M146 270h16M146 278h16" stroke-width="1.8" stroke="#93877a"/>
    </g>

    <!-- 万年筆（いちばん上の本にのせて） -->
    <g>
      <path d="M58 252h76" stroke="#2a6058" stroke-width="9"/>
      <path d="M58 252h22" stroke="#1f4f49" stroke-width="9"/>
      <path d="M134 252h16" stroke="#93877a" stroke-width="7"/>
      <path d="M150 252h12" stroke="#5e564f" stroke-width="4"/>
    </g>

    <!-- コーヒー（手前・右） -->
    <g>
      <ellipse cx="292" cy="348" rx="52" ry="9" fill="#f3eee8"/>
      <path fill="#fffdfb" d="M258 300l6 38q1 6 7 6h42q6 0 7-6l6-38Z"/>
      <path d="M326 310q18 3 15 18q-3 14-19 11" fill="#fffdfb"/>
