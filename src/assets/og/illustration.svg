      <ellipse cx="292" cy="300" rx="25" ry="5.5" fill="#5e564f" stroke="none" opacity="0.7"/>
      <!-- 湯気 -->
      <path d="M278 284q-8-10 0-19q7-9 0-18" stroke="#93877a" stroke-width="2.4"/>
      <path d="M306 282q-8-9 0-17q7-8 0-16" stroke="#93877a" stroke-width="2.4"/>
    </g>
  </g>
</svg>
